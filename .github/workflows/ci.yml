name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w . && git diff --exit-code
      - run: make check
      - run: make smoke
      - name: Shell lint
        run: shellcheck installer/*.sh scripts/*.sh scripts/integration/*.sh
