name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build static Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          for target in amd64 arm64 riscv64; do
            GOOS=linux GOARCH="$target" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/sundy-linux-$target" ./cmd/sundy
          done
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/sundy-linux-arm ./cmd/sundy
          cd dist
          sha256sum sundy-linux-* > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sundy-linux-*
            dist/checksums.txt
          generate_release_notes: true
